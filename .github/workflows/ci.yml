name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && ruff check app tests
      - run: cd backend && python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker build -t legsus:ci .
          docker run -d --name l -p 8000:8000 legsus:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 1; done
          curl -fs "localhost:8000/api/plan?from_lat=5.676&from_lon=-0.166&to_lat=5.57&to_lon=-0.215" | python -c "import sys,json; assert json.load(sys.stdin)['itineraries']"
